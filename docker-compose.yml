services:
  db:
    # PostGIS 3.6 sur PostgreSQL 18 (AD-3 : géométrie des tracés persistée en
    # PostGIS, SRID 4326) -- même image de base que `postgres:18.4`, donc
    # mêmes conventions de volume/healthcheck ci-dessous.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: bikeroute
      POSTGRES_PASSWORD: bikeroute
      POSTGRES_DB: bikeroute
    ports:
      # Port hôte non standard pour ne pas entrer en conflit avec un
      # PostgreSQL local déjà présent sur le 5432 par défaut.
      - '5433:5432'
    volumes:
      # PostgreSQL 18+ : monter /var/lib/postgresql (pas .../data), cf.
      # https://github.com/docker-library/postgres/pull/1259.
      - bikeroute_db_data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` seul rapporte "accepting connections" dès le serveur
      # temporaire de bootstrap (avant que POSTGRES_DB ne soit créée), ce qui
      # fait parfois démarrer `api` avant que la base "bikeroute" n'existe
      # réellement. On exige donc une requête qui réussit uniquement contre
      # le serveur final, sur la base applicative elle-même.
      test: ['CMD-SHELL', 'psql -U bikeroute -d bikeroute -c "SELECT 1" > /dev/null 2>&1']
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    environment:
      # DSN et réglages jamais en dur dans le code : cf. backend/app/config.py.
      DATABASE_URL: postgresql+psycopg://bikeroute:bikeroute@db:5432/bikeroute
      SESSION_DURATION_DAYS: '14'
      SESSION_COOKIE_NAME: session_id
      PASSWORD_MIN_LENGTH: '10'
      PASSWORD_MAX_LENGTH: '128'
      # Adaptateur `ValhallaRoutingProvider` (AD-8) : joint le service
      # `valhalla` ci-dessous sur le réseau Docker.
      VALHALLA_URL: http://valhalla:8002
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 20

  valhalla:
    # Épinglée à la version documentée par ARCHITECTURE-SPINE.md (Stack).
    image: ghcr.io/valhalla/valhalla:3.8.3
    volumes:
      # Corpus OSM minimal et déterministe (généré depuis corpus.osm.xml,
      # voir ce répertoire) : une petite boucle de voirie cyclable, suffisante
      # pour la QA manuelle de base de cette story (poser un départ/une
      # destination et voir un tracé) et pour ne dépendre d'aucun extrait OSM
      # réel. Un extrait plus large/représentatif reste à demander avant
      # téléchargement/commit (cf. Ask First de la spec-2-1) si une QA locale
      # plus réaliste devient nécessaire.
      - ./deploy/valhalla/corpus.osm.pbf:/data/corpus.osm.pbf:ro
      # Tuiles d'élévation SRTM/skadi (`/height`, spec-2-5, AD-8) : jamais
      # commitées (répertoire gitignored, même patron que l'extrait OSM réel
      # de QA locale, cf. `deploy/valhalla/data/.gitignore`) -- le corpus
      # synthétique (`corpus.osm.pbf`) ne couvre aucune donnée d'élévation
      # réelle (cf. Design Notes de la spec-2-5) ; à peupler manuellement
      # (fichiers `.hgt.gz`, format skadi) pour une QA locale avec dénivelé.
      - ./deploy/valhalla/data/elevation:/data/elevation:ro
    # Construit les tuiles à chaque démarrage plutôt que de les persister
    # dans un volume : le corpus est minuscule (build < 1s), et repartir à
    # chaque fois du `.pbf` committé garantit des tuiles toujours cohérentes
    # avec lui (jamais de tuiles "orphelines" d'une révision antérieure).
    entrypoint: ['bash', '-c']
    command:
      - >
        mkdir -p /data/tiles /data/elevation &&
        valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --additional-data-elevation /data/elevation > /data/valhalla.json &&
        valhalla_build_tiles -c /data/valhalla.json /data/corpus.osm.pbf &&
        valhalla_service /data/valhalla.json 1
    ports:
      - '8002:8002'
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8002/status')"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules reste interne au conteneur : sans cette exclusion, le
      # `npm install` Linux/Alpine écraserait le node_modules de l'hôte
      # (problématique en particulier sur un hôte non-Linux).
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # Le trajet interne Vite -> api reste en HTTP sur le réseau Docker ;
      # seule l'origine https://localhost:5173 vue par le navigateur compte
      # pour la politique de cookie Secure (cf. Design Notes de spec-1-1).
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  bikeroute_db_data:
