[project]
name = "bikeroute-backend"
version = "0.1.0"
description = "API FastAPI de BikeRoute"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "pydantic-settings>=2.6,<3.0",
    "uuid6>=2024.7,<2025.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false
